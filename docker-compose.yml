version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cias}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cias_password}
      POSTGRES_DB: ${POSTGRES_DB:-cias_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cias} -d ${POSTGRES_DB:-cias_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    stdin_open: true
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
